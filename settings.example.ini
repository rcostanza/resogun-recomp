# Copy to settings.ini and change what you need. Environment variables in parentheses override a key.
# A settings.ini in the save folder is read instead of the one next to the game; the in-game pages
# save there.
# Window: windowed, borderless (covers the screen at the desktop resolution) or fullscreen
# (RESOGUN_DISPLAY_MODE).
display_mode=borderless
# Output resolution, WIDTHxHEIGHT: the window's size when windowed, the screen mode in fullscreen.
# Borderless always outputs at the desktop resolution; pick fullscreen for another one
# (RESOGUN_OUTPUT_RESOLUTION). The game's picture is filtered to it.
output_resolution=1920x1080
# Display index the window opens on, empty for the primary (RESOGUN_MONITOR).
monitor=
# VSync (RESOGUN_VSYNC): 1 waits for the monitor; 0 shows the newest frame at each refresh,
# still without tearing (some drivers hold that to twice the refresh rate).
vsync=1
# With vsync=0: 1 shows each frame at once, tearing allowed: the least input delay and no frame rate
# ceiling (RESOGUN_TEARING). README "Advanced settings".
tearing=0
# The game's frame rate: 60 (the PS4's), 90, 120 or 180, at normal game speed: the engine's own
# frame rate and the PS4 vblank are both raised (RESOGUN_FRAME_RATE). It is held to what the display
# refreshes at (180 on a 120 Hz display runs at 120) unless VSync is off with tearing allowed. 90 on
# a 120 Hz display is smooth with VRR (FreeSync, G-Sync); without it frames show unevenly.
# Above 200 enemies stop spawning, so higher rates are not offered. The PC must hold the rate: a
# slower frame slows the game down. Also in the Display Settings panel (F10, or hold Select for
# 2 seconds), which applies it at once and saves it here with the other display keys.
frame_rate=60
# Render resolution, as the game itself offers it (RESOGUN_RENDER_RESOLUTION; next start):
#   4k    PS4 Pro mode: 3840x2160 frames, the 3D scene checkerboard-rendered (1920x2160 a frame)
#   1080p PS4 mode: native 1920x1080, lighter on the GPU
# The game has no native-4K mode. Either is filtered to the output resolution.
render_resolution=4k
# Speakers: auto, stereo, 5.1, 7.1 (RESOGUN_AUDIO_CHANNELS).
audio_channels=auto
# 1 (default): skip the start-up logos and notices; 0 shows them. The setup's checkbox sets it
# (RESOGUN_SKIP_INTRO).
skip_intro=1
# 1 (default): Back (Circle, B, Esc) on the title screen ("Press X to start") asks whether to
# close the game; 0 leaves Back to the game, which ignores it there (RESOGUN_TITLE_BACK_EXITS).
title_back_exits=1
